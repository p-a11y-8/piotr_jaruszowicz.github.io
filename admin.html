<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Set Video Timer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-form {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 15px;
            margin-top: 20px;
        }

        .admin-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color-scheme: dark;
            /* makes the calendar popup dark mode */
            transition: border-color 0.3s;
        }

        .admin-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .msg {
            margin-top: 15px;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .msg.show {
            opacity: 1;
        }

        .success {
            color: #4ade80;
        }

        .info {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <!-- Animated background elements -->
    <div class="blob shape1"></div>
    <div class="blob shape2"></div>
    <div class="blob shape3"></div>
    <div class="blob shape4"></div>
    <div class="blob shape5"></div>
    <div class="blob shape6"></div>

    <main class="glass-card"
        style="align-items: center; justify-content: center; max-width: 400px; padding: 40px 30px;">
        <!-- Login Section -->
        <div id="login-section"
            style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px;">
            <h1 class="name">Admin Access</h1>
            <p class="bio" style="margin-bottom: 5px;">Enter password to continue</p>
            <input type="password" id="admin-password" class="admin-input" placeholder="Password"
                style="text-align: center;" onkeypress="if(event.key === 'Enter') checkPassword()">
            <button class="contact-btn" onclick="checkPassword()"
                style="background: rgba(255,255,255,0.1); border-color: transparent;">
                <i class="fas fa-lock-open"></i> Login
            </button>
            <p id="login-msg" class="msg"></p>
            <div style="margin-top: 15px; width: 100%;">
                <a href="index.html" class="contact-btn">
                    <i class="fas fa-arrow-left"></i> Back to Profile
                </a>
            </div>
        </div>

        <!-- Admin Settings Section -->
        <div id="admin-section" style="display: none; width: 100%; flex-direction: column; align-items: center;">
            <h1 class="name">Admin Panel</h1>
            <p class="bio" style="margin-bottom: 5px;">Set your next video release</p>

            <div class="admin-form">
                <label for="release-date"
                    style="color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Date
                    & Strict Hour</label>
                <input type="datetime-local" id="release-date" class="admin-input">

                <button class="contact-btn" onclick="saveDate()"
                    style="background: rgba(255,255,255,0.1); border-color: transparent;">
                    <i class="fas fa-save"></i> Save Countdown
                </button>
                <button class="contact-btn" onclick="clearDate()"
                    style="border-color: rgba(255,0,0,0.3); color: #ff6b6b;">
                    <i class="fas fa-trash"></i> Clear (Not Planned)
                </button>
            </div>

            <p id="admin-msg" class="msg"></p>

            <div style="margin-top: 30px; width: 100%;">
                <button onclick="logout()" class="contact-btn"
                    style="border-color: rgba(255,0,0,0.3); color: #ff6b6b; margin-bottom: 15px;">
                    <i class="fas fa-sign-out-alt"></i> Lock Panel
                </button>
                <a href="index.html" class="contact-btn">
                    <i class="fas fa-arrow-left"></i> Back to Profile
                </a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const blobs = document.querySelectorAll('.blob');
            let targetX = document.documentElement.clientWidth / 2;
            let targetY = document.documentElement.clientHeight / 2;
            let currentX = targetX;
            let currentY = targetY;

            document.addEventListener('mousemove', (e) => {
                targetX = e.clientX;
                targetY = e.clientY;
            });

            function animate() {
                currentX += (targetX - currentX) * 0.05;
                currentY += (targetY - currentY) * 0.05;
                const time = Date.now() * 0.001;
                const windowWidth = document.documentElement.clientWidth;
                const windowHeight = document.documentElement.clientHeight;

                blobs.forEach((blob, index) => {
                    const speed = (index + 1) * 0.03;
                    const x = (currentX - windowWidth / 2) * speed + Math.sin(time + index * 2) * 40;
                    const y = (currentY - windowHeight / 2) * speed + Math.cos(time + index * 2) * 40;
                    blob.style.transform = `translate(${x}px, ${y}px)`;
                });
                requestAnimationFrame(animate);
            }
            animate();

            // Layout reveal
            setTimeout(() => {
                document.querySelector('.glass-card').style.opacity = '1';
                document.querySelector('.glass-card').style.transform = 'translateY(0)';
            }, 100);

            // Load existing date
            const savedDate = localStorage.getItem('nextVideoDate');
            if (savedDate) {
                document.getElementById('release-date').value = savedDate;
            }
        });

        function showMessage(text, isSuccess) {
            const msgEl = document.getElementById('admin-msg');
            msgEl.textContent = text;
            msgEl.className = "msg show " + (isSuccess ? "success" : "info");
            setTimeout(() => { msgEl.classList.remove('show'); }, 3000);
        }

        function saveDate() {
            const dateVal = document.getElementById('release-date').value;
            if (!dateVal) {
                showMessage("Please select a date and time!", false);
                return;
            }
            localStorage.setItem('nextVideoDate', dateVal);
            showMessage("Date saved successfully!", true);
        }

        function clearDate() {
            localStorage.removeItem('nextVideoDate');
            document.getElementById('release-date').value = '';
            showMessage("Timer cleared (Not Planned).", false);
        }

        // Authentication Logic
        function checkPassword() {
            const pwd = document.getElementById('admin-password').value;
            if (pwd === '4321') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'flex';
                document.getElementById('admin-password').value = ''; // clear input
            } else {
                const msgEl = document.getElementById('login-msg');
                msgEl.textContent = "Incorrect password";
                msgEl.className = "msg show";
                msgEl.style.color = "#ff6b6b";
                setTimeout(() => { msgEl.classList.remove('show'); }, 3000);
            }
        }

        function logout() {
            document.getElementById('admin-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'flex';
        }
    </script>
</body>

</html>
