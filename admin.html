<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Piotr Jaruszowicz</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
</head>

<body>
    <!-- Animated background elements -->
    <div class="blob shape1"></div>
    <div class="blob shape2"></div>
    <div class="blob shape3"></div>
    <div class="blob shape4"></div>
    <div class="blob shape5"></div>
    <div class="blob shape6"></div>

    <main class="glass-card"
        style="align-items: center; justify-content: center; max-width: 400px; padding: 40px 30px; opacity: 1; transform: translateY(0);">
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px;">
            <h1 class="name">Admin Panel</h1>
            <p class="bio" style="margin-bottom: 5px;">This section is currently inactive.</p>
            
            <div style="margin-top: 15px; width: 100%;">
                <a href="index.html" class="social-link" style="justify-content: center;">
                    <i class="fas fa-arrow-left"></i> <span>Back to Profile</span>
                </a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const blobs = document.querySelectorAll('.blob');
            let targetX = document.documentElement.clientWidth / 2;
            let targetY = document.documentElement.clientHeight / 2;
            let currentX = targetX;
            let currentY = targetY;

            document.addEventListener('mousemove', (e) => {
                targetX = e.clientX;
                targetY = e.clientY;
            });

            function animate() {
                currentX += (targetX - currentX) * 0.05;
                currentY += (targetY - currentY) * 0.05;
                const time = Date.now() * 0.001;
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;

                blobs.forEach((blob, index) => {
                    const speed = (index + 1) * 0.03;
                    const x = (currentX - centerX) * speed + Math.sin(time + index * 2) * 40;
                    const y = (currentY - centerY) * speed + Math.cos(time + index * 2) * 40;
                    blob.style.transform = `translate3d(${x}px, ${y}px, 0)`;
                });
                requestAnimationFrame(animate);
            }
            animate();
        });
    </script>

</body>

</html>
