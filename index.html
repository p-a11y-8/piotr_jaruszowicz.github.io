<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Links</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
</head>

<body>
    <!-- Page Loader Animation -->
    <div class="page-loader">
        <img class="drone-loader" src="https://images.icon-icons.com/2596/PNG/512/drone_icon_155461.png"
            alt="Drone Loader">
    </div>
    <!-- Animated background elements -->
    <div class="blob shape1"></div>
    <div class="blob shape2"></div>
    <div class="blob shape3"></div>
    <div class="blob shape4"></div>
    <div class="blob shape5"></div>
    <div class="blob shape6"></div>

    <main class="glass-card">
        <div class="profile-container">
            <img src="profile.png"
                alt="Profile Picture" class="profile-pic">
        </div>
        <h1 class="name">Piotr Jaruszowicz <img src="logo.png" alt="Page Logo" class="name-logo"></h1>
        <p class="bio">Hobby Videographer</p>

        <div class="links-container" id="links-container">
            <!-- Links will be injected here -->
        </div>

        <div class="contact-divider">
            <span>Skontaktuj się</span>
        </div>

        <div class="contact-info">
            <a href="mailto:pjaruszowicz@gmail.com" class="contact-btn">
                <i class="fas fa-envelope"></i> pjaruszowicz@gmail.com
            </a>
        </div>
        </div>
    </main>

    <!-- My Gear Popup -->
    <div class="gear-popup" id="gearPopup">
        <div class="gear-content">
            <div class="gear-header">
                <h2>My Gear</h2>
                <button class="close-btn" onclick="toggleGearPopup()"><i class="fas fa-times"></i></button>
            </div>
            <ul class="gear-list">
                <li>
                    <img src="https://images.icon-icons.com/2596/PNG/512/drone_icon_155461.png"
                        style="width: 30px; margin-right: 15px; filter: brightness(0) invert(1);" alt="Drone Loader">
                    <div class="gear-details">
                        <span class="gear-name">DJI Mini 4 Pro</span>
                        <span class="gear-desc">Primary Drone</span>
                    </div>
                </li>
                <li>
                    <i class="fas fa-film"></i>
                    <div class="gear-details">
                        <span class="gear-name">DaVinci Resolve</span>
                        <span class="gear-desc">Video Editing Software</span>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // Page Load Animation
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.querySelector('.page-loader').classList.add('hidden');
                document.querySelector('.glass-card').style.opacity = '1';
                document.querySelector('.glass-card').style.transform = 'translateY(0)';
            }, 200);
        });

        // Toggle Gear Popup
        function toggleGearPopup() {
            const popup = document.getElementById('gearPopup');
            popup.classList.toggle('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const blobs = document.querySelectorAll('.blob');
            let targetX = window.innerWidth / 2;
            let targetY = window.innerHeight / 2;
            let currentX = targetX;
            let currentY = targetY;

            document.addEventListener('mousemove', (e) => {
                targetX = e.clientX;
                targetY = e.clientY;
            });

            function animate() {
                currentX += (targetX - currentX) * 0.05;
                currentY += (targetY - currentY) * 0.05;
                const time = Date.now() * 0.001;
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;

                blobs.forEach((blob, index) => {
                    const speed = (index + 1) * 0.03;
                    const x = (currentX - centerX) * speed + Math.sin(time + index * 2) * 40;
                    const y = (currentY - centerY) * speed + Math.cos(time + index * 2) * 40;
                    blob.style.transform = `translate3d(${x}px, ${y}px, 0)`;
                });
                requestAnimationFrame(animate);
            }
            animate();

            loadDynamicContent();
        });

        function loadDynamicContent() {
            // Load Links
            const container = document.getElementById('links-container');

            // Hardcoded links as requested (removing localStorage dependency)
            const links = [
                { title: 'Instagram', url: 'https://instagram.com/jar_piotr', subtitle: '68 Followers', icon: 'fab fa-instagram', visible: true, class: 'instagram' },
                { title: 'TikTok', url: 'https://tiktok.com/@jar_piotr', subtitle: '1k Followers', icon: 'fab fa-tiktok', visible: true, class: 'tiktok' }
            ];

            container.innerHTML = '';
            links.forEach(link => {
                if (link.visible !== false) {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = "_blank";
                    a.className = `social-link ${link.class || ''}`;
                    a.innerHTML = `
                        <i class="${link.icon}"></i>
                        <div class="link-text-wrapper">
                            <span>${link.title}</span>
                            <span class="follower-count">${link.subtitle}</span>
                        </div>
                        <i class="fas fa-arrow-right hover-arrow"></i>
                    `;
                    container.appendChild(a);
                }
            });

            // Add My Gear button manually at the end
            const gearBtn = document.createElement('button');
            gearBtn.className = 'social-link gear-btn';
            gearBtn.onclick = toggleGearPopup;
            gearBtn.innerHTML = `
                <i class="fas fa-camera-retro"></i>
                <div class="link-text-wrapper">
                    <span>My Gear</span>
                    <span class="follower-count">See what I use</span>
                </div>
                <i class="fas fa-chevron-down hover-arrow"></i>
            `;
            container.appendChild(gearBtn);

            // Fetch dynamic IG followers if linked to jar_piotr
            fetchIGFollowers();
        }

        async function fetchIGFollowers() {
            try {
                const username = 'jar_piotr';
                const proxyUrl = 'https://corsproxy.io/?';
                const targetUrl = encodeURIComponent(`https://blastup.com/api/ig/user/${username}`);
                const response = await fetch(proxyUrl + targetUrl);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.followers) {
                        let count = data.followers;
                        let formattedCount = count > 1000 ? (count / 1000).toFixed(1) + 'k' : count;
                        // Only update if it's the auto-fetched one
                        const igSubtitle = document.querySelector('.instagram .follower-count');
                        if (igSubtitle) igSubtitle.textContent = `${formattedCount} Followers`;
                    }
                }
            } catch (e) { console.error('Silent IG fetch failed', e); }
        }
    </script>

    <!-- Small Admin Button -->
    <a href="admin.html" class="admin-button" title="Admin Panel">
        <i class="fas fa-cog"></i>
    </a>
</body>

</html>
